<head>

<title>Brocante Maisons-Laffitte</title>
<meta name="description" content="Objets à vendre à Maisons-Laffitte : informatique, réseau, téléphonie, électroménager. Liste mise à jour au fil des ventes.">
<style>
  :root{
    --paper:#ece3cf;
    --card:#f6efdd;
    --ink:#2b2620;
    --ink-soft:#5c5341;
    --line:#c3b696;
    --stamp:#b3402d;
    --stamp-ink:#f6efdd;
    --forest:#3e5c3a;
    --sold:#8a8168;
    --shadow: 2px 3px 0 rgba(43,38,32,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1c1913;
      --card:#241f17;
      --ink:#ece3cf;
      --ink-soft:#b8ac8e;
      --line:#4a4331;
      --stamp:#e0664f;
      --stamp-ink:#1c1913;
      --forest:#7fa878;
      --sold:#7a7359;
      --shadow: 2px 3px 0 rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1c1913;
    --card:#241f17;
    --ink:#ece3cf;
    --ink-soft:#b8ac8e;
    --line:#4a4331;
    --stamp:#e0664f;
    --stamp-ink:#1c1913;
    --forest:#7fa878;
    --sold:#7a7359;
    --shadow: 2px 3px 0 rgba(0,0,0,0.4);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', 'Segoe UI', sans-serif;
    margin:0;
    padding-inline:20px;
    padding-block:32px;
    display:flex;
    justify-content:center;
  }
  main{width:100%; max-width:720px; display:flex; flex-direction:column; gap:32px;}

  .lang-switch{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    align-self:flex-start;
  }
  .lang-icon{font-size:16px; line-height:1;}
  .lang-btn{
    font-family:'Space Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:none;
    border:1.5px solid var(--line);
    color:var(--ink-soft);
    border-radius:3px;
    padding:5px 10px;
    cursor:pointer;
  }
  .lang-btn.active{border-color:var(--stamp); color:var(--stamp); font-weight:700;}
  .lang-btn:hover{border-color:var(--ink); color:var(--ink);}

  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--forest);
  }
  h1{
    font-family:'Bricolage Grotesque', 'Public Sans', sans-serif;
    font-weight:800;
    font-size:clamp(32px,7vw,46px);
    line-height:1.05;
    margin:6px 0 0;
    text-wrap:balance;
  }
  .sub{
    color:var(--ink-soft);
    font-size:15px;
    margin-top:10px;
    max-width:52ch;
  }

  .qr-block{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    box-shadow:var(--shadow);
    padding:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    text-align:center;
  }
  .qr-block .stamp{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--stamp);
    border:1.5px dashed var(--stamp);
    border-radius:3px;
    padding:3px 10px;
    transform:rotate(-2deg);
  }
  #qr{
    background:#fff;
    padding:12px;
    border-radius:4px;
    line-height:0;
  }
  .qr-caption{font-size:13px; color:var(--ink-soft); max-width:38ch;}

  .access-options{display:flex; flex-direction:column; gap:0;}
  .or-divider{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 0;
    color:var(--ink-soft);
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
  }
  .or-divider::before, .or-divider::after{content:""; flex:1; height:1px; background:var(--line);}

  .alt-block{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    box-shadow:var(--shadow);
    padding:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
  }
  .alt-phone{
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:800;
    font-size:clamp(26px,6vw,32px);
    color:var(--ink);
    text-decoration:none;
    letter-spacing:0.02em;
  }
  .alt-phone:hover{color:var(--stamp);}
  .alt-caption{font-size:13px; color:var(--ink-soft); margin:0;}
  .alt-url{
    font-family:'Space Mono', monospace;
    font-size:16px;
    font-weight:700;
    color:var(--forest);
    word-break:break-all;
    padding-top:4px;
  }
  .print-btn{
    font-family:'Space Mono', monospace;
    font-size:13px;
    background:none;
    border:1.5px solid var(--ink);
    color:var(--ink);
    border-radius:3px;
    padding:8px 16px;
    cursor:pointer;
  }
  .print-btn:hover{background:var(--ink); color:var(--card);}

  section h2{
    font-family:'Bricolage Grotesque', sans-serif;
    font-size:20px;
    font-weight:700;
    margin:0 0 4px;
  }
  .section-note{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 16px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:16px;
  }
  .item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .item:hover{outline:2px solid var(--forest); outline-offset:2px;}
  .item:focus{outline:none;}
  .item:focus-visible{outline:2px solid var(--forest); outline-offset:2px;}
  .item-photo{
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    display:block;
    background:var(--line);
  }
  .item-body{
    padding:14px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
  }
  .item-name{font-family:'Bricolage Grotesque', sans-serif; font-weight:700; font-size:16px;}
  .item-desc{font-size:13px; color:var(--ink-soft); line-height:1.45;}
  .item-foot{
    margin-top:auto;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    padding-top:6px;
    border-top:1px dashed var(--line);
  }
  .price{
    font-family:'Space Mono', monospace;
    font-variant-numeric:tabular-nums;
    font-size:17px;
    font-weight:700;
    color:var(--stamp);
    white-space:nowrap;
  }
  .price-tag{
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .etat{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  .contact{
    background:var(--forest);
    color:var(--stamp-ink);
    border-radius:4px;
    padding:18px 20px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .contact .label{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    opacity:0.85;
  }
  .contact .value{font-size:15px; font-weight:600;}
  .contact .value a{color:inherit;}

  footer{
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
    padding-top:8px;
    border-top:1px dashed var(--line);
  }

  @media print{
    body{padding:0; background:#fff;}
    .grid, .contact, footer, .print-btn, .sub, .lang-switch{display:none;}
    main{max-width:100%;}
    .qr-block, .alt-block{box-shadow:none; border:2px solid #000;}
    .or-divider{color:#000;}
    .or-divider::before, .or-divider::after{background:#000;}
  }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(20,17,12,0.72);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    padding-top:calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    z-index:100;
  }
  .modal-overlay[hidden]{display:none;}
  .modal{
    background:var(--card);
    border-radius:8px;
    max-width:640px;
    width:100%;
    max-height:100%;
    overflow-y:auto;
    position:relative;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
  }
  .modal-close{
    position:absolute;
    top:10px; right:10px;
    width:36px; height:36px;
    border-radius:50%;
    border:none;
    background:var(--ink);
    color:var(--card);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    z-index:2;
  }
  .modal-main-img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--line);}
  .modal-thumbs{display:flex; gap:8px; padding:10px; overflow-x:auto;}
  .modal-thumbs img{
    width:60px; height:60px; object-fit:cover; border-radius:4px;
    cursor:pointer; border:2px solid transparent; flex-shrink:0;
  }
  .modal-thumbs img.active{border-color:var(--stamp);}
  .modal-body{padding:8px 24px 24px;}
  .modal-body h3{
    font-family:'Bricolage Grotesque', sans-serif;
    font-size:22px;
    margin:4px 0 10px;
  }
  .modal-desc{font-size:14.5px; line-height:1.55; color:var(--ink-soft); white-space:pre-line;}
  .modal-meta{
    display:flex; align-items:center; gap:14px;
    margin-top:14px; padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .modal-meta .price{font-family:'Space Mono', monospace; font-size:22px; font-weight:700; color:var(--stamp);}
  .modal-meta .etat{font-family:'Space Mono', monospace; font-size:11px; text-transform:uppercase; color:var(--ink-soft);}

  .modal-contact{margin-top:20px; padding-top:16px; border-top:1px dashed var(--line);}
  .contact-label{font-size:13px; color:var(--ink-soft); margin:0 0 10px;}
  .contact-buttons{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .contact-btn{
    display:flex; align-items:center; gap:8px;
    padding:10px 12px;
    border-radius:6px;
    text-decoration:none;
    font-family:'Public Sans', sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:#fff;
  }
  .contact-btn svg{width:20px; height:20px; flex-shrink:0;}
  .contact-btn.wa{background:#25D366; color:#08331c;}
  .contact-btn.sms{background:var(--forest); color:#fff;}
  .contact-btn.call{background:var(--ink); color:var(--card);}
  .contact-btn.li{background:#0A66C2; color:#fff;}
  .contact-note{font-size:11.5px; color:var(--ink-soft); margin:8px 0 0;}
</style>

  var LANGS = [
    { code: "fr", label: "FR", native: "Français" },
    { code: "en", label: "EN", native: "English" },
    { code: "es", label: "ES", native: "Español" },
    { code: "it", label: "IT", native: "Italiano" },
    { code: "de", label: "DE", native: "Deutsch" }
  ];

  var currentLang = "fr";
  try{
    var saved = localStorage.getItem("brocante-lang");
    if(saved && T[saved]) currentLang = saved;
    else {
      var nav = (navigator.language || "fr").slice(0,2);
      if(T[nav]) currentLang = nav;
    }
  }catch(e){}

  function setLang(lang){
    if(!T[lang]) return;
    currentLang = lang;
    try{ localStorage.setItem("brocante-lang", lang); }catch(e){}
    render();
  }

  function renderLangSwitch(){
    var el = document.getElementById("lang-switch");
    el.innerHTML = "";
    var icon = document.createElement("span");
    icon.className = "lang-icon";
    icon.textContent = "🌐";
    icon.setAttribute("aria-hidden", "true");
    el.appendChild(icon);
    LANGS.forEach(function(l){
      var b = document.createElement("button");
      b.className = "lang-btn" + (l.code === currentLang ? " active" : "");
      b.textContent = l.label;
      b.title = l.native;
      b.setAttribute("aria-pressed", l.code === currentLang ? "true" : "false");
      b.setAttribute("aria-label", l.native);
      b.onclick = function(){ setLang(l.code); };
      el.appendChild(b);
    });
  }

  function renderGrid(){
    var t = T[currentLang];
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    ITEMS.forEach(function(item){
      var data = t.items[item.id];
      var card = document.createElement("div");
      card.className = "item";
      card.dataset.id = item.id;
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-haspopup", "dialog");
      card.innerHTML =
        '<img class="item-photo" src="objets/' + item.images[0] + '" alt="' + data.name.replace(/"/g,"&quot;") + '">' +
        '<div class="item-body">' +
          '<div class="item-name">' + data.name + '</div>' +
          '<p class="item-desc">' + data.descShort + '</p>' +
          '<div class="etat">' + data.etat + '</div>' +
          '<div class="item-foot">' +
            '<span class="price">' + item.price + '</span>' +
            '<span class="price-tag">' + (item.lot ? t.priceLabelLot : t.priceLabel) + '</span>' +
          '</div>' +
        '</div>';
      card.addEventListener("click", function(){ openModal(item.id); });
      card.addEventListener("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openModal(item.id); }
      });
      grid.appendChild(card);
    });
  }

  function render(){
    var t = T[currentLang];
    document.documentElement.lang = currentLang;
    renderLangSwitch();

    document.getElementById("t-eyebrow").textContent = t.eyebrow;
    document.getElementById("t-title").textContent = t.title;
    document.getElementById("t-sub").textContent = t.sub;
    document.getElementById("t-scan").textContent = t.scan;
    document.getElementById("t-qrcaption").textContent = t.qrCaption;
    document.getElementById("t-printbtn").textContent = t.printBtn;
    document.getElementById("t-or").textContent = t.orWord;
    document.getElementById("t-nosmartphone").textContent = t.noSmartphone;
    document.getElementById("t-callorvisit").textContent = t.callOrVisit;
    document.getElementById("t-ortype").textContent = t.orType;
    document.getElementById("t-sectiontitle").textContent = t.sectionTitle;
    document.getElementById("t-sectionnote").textContent = t.sectionNote;
    document.getElementById("t-contactlabel").textContent = t.contactLabel;
    document.getElementById("t-alsowhatsapp").textContent = t.alsoWhatsapp;
    document.getElementById("t-neighborhoodlabel").textContent = t.neighborhoodLabel;
    document.getElementById("t-neighborhoodvalue").textContent = t.neighborhoodValue;
    document.getElementById("t-footer").textContent = t.footer;
    document.getElementById("t-modalcontactlabel").textContent = t.modalContactLabel;
    document.getElementById("t-modalcontactnote").textContent = t.modalContactNote;
    document.getElementById("t-walabel").textContent = t.waLabel;
    document.getElementById("t-smslabel").textContent = t.smsLabel;
    document.getElementById("t-calllabel").textContent = t.callLabel;
    document.getElementById("t-lilabel").textContent = t.liLabel;
    document.getElementById("modal-close-btn").setAttribute("aria-label", t.closeLabel);

    renderGrid();

    if(!overlay.hidden && openItemId) openModal(openItemId, true);
  }

  var overlay = document.getElementById("modal-overlay");
  var lastFocused = null;
  var openItemId = null;

  function openModal(id, keepFocus){
    var t = T[currentLang];
    var itemMeta = ITEMS.filter(function(i){ return i.id === id; })[0];
    var data = t.items[id];
    if(!itemMeta || !data) return;
    openItemId = id;
    if(!keepFocus) lastFocused = document.activeElement;

    document.getElementById("modal-title").textContent = data.name;
    document.getElementById("modal-desc").textContent = data.descLong;
    document.getElementById("modal-price").textContent = itemMeta.price;
    document.getElementById("modal-etat").textContent = data.etat;

    var activeSrc = document.getElementById("modal-main-img").src;
    var activeIndex = 0;
    itemMeta.images.forEach(function(src, i){ if(activeSrc.indexOf(src) !== -1) activeIndex = i; });
    setMainImage(itemMeta.images[keepFocus ? activeIndex : 0]);

    var thumbs = document.getElementById("modal-thumbs");
    thumbs.innerHTML = "";
    if(itemMeta.images.length > 1){
      itemMeta.images.forEach(function(src, i){
        var th = document.createElement("img");
        th.src = "objets/" + src;
        th.alt = "";
        if(i === (keepFocus ? activeIndex : 0)) th.className = "active";
        th.onclick = function(){ setMainImage(src, th); };
        thumbs.appendChild(th);
      });
    }

    var message = encodeURIComponent(t.waMessage(data.name));
    document.getElementById("btn-whatsapp").href = "https://wa.me/33749395380?text=" + message;
    document.getElementById("btn-sms").href = "sms:+33749395380?body=" + message;

    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    if(!keepFocus) document.getElementById("modal-close-btn").focus();
  }

  function setMainImage(src, thumbEl){
    document.getElementById("modal-main-img").src = "objets/" + src;
    document.querySelectorAll("#modal-thumbs img").forEach(function(el){ el.classList.remove("active"); });
    if(thumbEl) thumbEl.classList.add("active");
  }

  function closeModal(){
    overlay.hidden = true;
    openItemId = null;
    document.body.style.overflow = "";
    if(lastFocused) lastFocused.focus();
  }

  document.getElementById("modal-close-btn").addEventListener("click", closeModal);
  overlay.addEventListener("click", function(e){
    if(e.target === overlay) closeModal();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && !overlay.hidden) closeModal();
  });

  render();

  try{
    new QRCode(document.getElementById("qr"), {
      text: window.location.href,
      width: 168,
      height: 168,
      colorDark: "#2b2620",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  }catch(e){
    document.getElementById("qr").textContent = "QR unavailable offline";
  }
</script>
</body>
</html>
